<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <!-- Ambient Soft Shadows -->
    <filter id="shadow-main" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E2A55" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="0.75" stdDeviation="0.75" flood-color="#1E2A55" flood-opacity="0.12" />
    </filter>
    
    <filter id="shadow-small" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1E2A55" flood-opacity="0.18" />
    </filter>

    <!-- Folder Plate Gradients -->
    <linearGradient id="folder-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF9100" />
    </linearGradient>

    <linearGradient id="folder-shd" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B76200" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#B76200" stop-opacity="0" />
    </linearGradient>

    <!-- Peaking Document Gradients (Periwinkle & Coral) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5C4F7" />
      <stop offset="100%" stop-color="#6081E6" />
    </linearGradient>

    <linearGradient id="fld-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD6E8" />
      <stop offset="100%" stop-color="#FF8EB4" />
    </linearGradient>

    <!-- Toy House Gradients (Coral-Red Roof & Cream Wall) -->
    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8EB4" />
      <stop offset="100%" stop-color="#FF3E6C" />
    </linearGradient>

    <linearGradient id="roof-shd" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9C002B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#9C002B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECEFF1" />
    </linearGradient>

    <linearGradient id="wall-shd" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#90A4AE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#90A4AE" stop-opacity="0" />
    </linearGradient>

    <!-- Gloss Highlight Overlay -->
    <linearGradient id="inner-high" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Folder Back Plate Group (With Tab) -->
  <g filter="url(#shadow-main)">
    <!-- Back Plate Base -->
    <path d="M 3 8 C 3 6.3 4.3 5 6 5 H 9.5 C 10.3 5 11.0 5.4 11.4 6.1 L 12.6 8.0 C 13.0 8.6 13.7 9 14.4 9 H 18 C 19.7 9 21 10.3 21 12 V 18 C 21 19.7 19.7 21 18 21 H 6 C 4.3 21 3 19.7 3 18 Z" fill="url(#folder-grad)" />
    <!-- 3D Overlays -->
    <path d="M 3 8 C 3 6.3 4.3 5 6 5 H 9.5 C 10.3 5 11.0 5.4 11.4 6.1 L 12.6 8.0 C 13.0 8.6 13.7 9 14.4 9 H 18 C 19.7 9 21 10.3 21 12 V 18 C 21 19.7 19.7 21 18 21 H 6 C 4.3 21 3 19.7 3 18 Z" fill="url(#inner-high)" />
    <path d="M 3 8 C 3 6.3 4.3 5 6 5 H 9.5 C 10.3 5 11.0 5.4 11.4 6.1 L 12.6 8.0 C 13.0 8.6 13.7 9 14.4 9 H 18 C 19.7 9 21 10.3 21 12 V 18 C 21 19.7 19.7 21 18 21 H 6 C 4.3 21 3 19.7 3 18 Z" fill="url(#folder-shd)" />
  </g>

  <!-- 2. Peaking Document Group (Tilted & Puffy) -->
  <g transform="rotate(6, 11, 10)" filter="url(#shadow-small)">
    <!-- Document Base -->
    <rect x="6.5" y="4.5" width="10" height="10" rx="1.8" fill="url(#bg-grad)" />
    <!-- 3D Overlays -->
    <rect x="6.5" y="4.5" width="10" height="10" rx="1.8" fill="url(#inner-high)" />
    
    <!-- Mini Folder Corner Fold -->
    <path d="M 13.5 4.5 L 16.5 7.5 H 14.5 C 13.5 7.5 13.5 6.5 13.5 5.5 Z" fill="url(#fld-grad)" />
    <path d="M 13.5 4.5 L 16.5 7.5 H 14.5 C 13.5 7.5 13.5 6.5 13.5 5.5 Z" fill="url(#inner-high)" opacity="0.5" />
  </g>

  <!-- 3. Folder Front Pocket Group -->
  <g filter="url(#shadow-small)">
    <!-- Front Pocket Base -->
    <path d="M 3 12 C 3 10.3 4.3 9 6 9 H 18 C 19.7 9 21 10.3 21 12 V 18 C 21 19.7 19.7 21 18 21 H 6 C 4.3 21 3 19.7 3 18 Z" fill="url(#folder-grad)" />
    <!-- 3D Overlays -->
    <path d="M 3 12 C 3 10.3 4.3 9 6 9 H 18 C 19.7 9 21 10.3 21 12 V 18 C 21 19.7 19.7 21 18 21 H 6 C 4.3 21 3 19.7 3 18 Z" fill="url(#inner-high)" />
    <path d="M 3 12 C 3 10.3 4.3 9 6 9 H 18 C 19.7 9 21 10.3 21 12 V 18 C 21 19.7 19.7 21 18 21 H 6 C 4.3 21 3 19.7 3 18 Z" fill="url(#folder-shd)" />
  </g>

  <!-- 4. Puffy House Wall -->
  <g filter="url(#shadow-small)">
    <rect x="10.25" y="14.0" width="3.5" height="3.5" rx="0.6" fill="url(#wall-grad)" />
    <!-- 3D Overlays -->
    <rect x="10.25" y="14.0" width="3.5" height="3.5" rx="0.6" fill="url(#inner-high)" opacity="0.4" />
    <rect x="10.25" y="14.0" width="3.5" height="3.5" rx="0.6" fill="url(#wall-shd)" />
  </g>

  <!-- 5. Puffy House Roof -->
  <g filter="url(#shadow-small)">
    <!-- Roof Triangle (With stroke-width to round the corners) -->
    <path d="M 9.5 14.0 L 12.0 11.5 L 14.5 14.0 Z" fill="url(#roof-grad)" stroke="url(#roof-grad)" stroke-width="1.2" stroke-linejoin="round" />
    <!-- 3D Overlays -->
    <path d="M 9.5 14.0 L 12.0 11.5 L 14.5 14.0 Z" fill="url(#inner-high)" stroke="url(#inner-high)" stroke-width="1.2" stroke-linejoin="round" opacity="0.4" />
    <path d="M 9.5 14.0 L 12.0 11.5 L 14.5 14.0 Z" fill="url(#roof-shd)" stroke="url(#roof-shd)" stroke-width="1.2" stroke-linejoin="round" />
  </g>

  <!-- 6. Door, Window & Specular Layer (No drop shadow for maximum crispness) -->
  <g pointer-events="none">
    <!-- Back Tab Highlight Curve -->
    <path d="M 4.5 7.2 C 4.5 6.2 5.5 5.5 6.5 5.5 H 9" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-linecap="round" opacity="0.65" />
    
    <!-- Front Pocket Top Lip Highlight -->
    <path d="M 5 9.5 H 19" stroke="#FFFFFF" stroke-width="0.5" stroke-linecap="round" opacity="0.6" />

    <!-- Toy House Door -->
    <rect x="11.4" y="15.5" width="1.2" height="2.0" rx="0.4" fill="#2C3E50" />
    <!-- Door Inner Specular -->
    <rect x="11.4" y="15.5" width="1.2" height="2.0" rx="0.4" fill="#FFFFFF" opacity="0.1" />

    <!-- Toy House Circular Attic Window -->
    <circle cx="12" cy="13.1" r="0.4" fill="#2C3E50" />

    <!-- Roof Left-Slope Highlight -->
    <line x1="9.5" y1="13.9" x2="11.8" y2="11.6" stroke="#FFFFFF" stroke-width="0.35" stroke-linecap="round" opacity="0.65" />

    <!-- Wall Top-Left Specular -->
    <rect x="10.5" y="14.3" width="0.6" height="0.6" rx="0.15" fill="#FFFFFF" opacity="0.5" />
  </g>
</svg>